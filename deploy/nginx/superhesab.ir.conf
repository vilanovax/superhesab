# superhesab.ir — لندینگ استاتیک

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name superhesab.ir www.superhesab.ir;

    include /etc/nginx/snippets/ssl-superhesab.conf;

    root /home/superhesab/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(svg|png|jpg|jpeg|gif|ico|css|js|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name superhesab.ir www.superhesab.ir;

    return 301 https://$host$request_uri;
}
